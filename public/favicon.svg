<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    The header logo (Logo in src/components/layout/Header.tsx) as a standalone favicon.
    A favicon cannot read the page's CSS variables, so the theme tokens are copied here as
    literals: light values by default, dark-theme values when the browser prefers dark.
  -->
  <style>
    .creational { fill: #007a55; } /* --color-cat-creational: emerald-700 */
    .structural { fill: #0069a8; } /* --color-cat-structural: sky-700 */
    .behavioral { fill: #9810fa; } /* --color-cat-behavioral: purple-600 */
    .link { stroke: #676862; } /* --color-fg-subtle */
    @media (prefers-color-scheme: dark) {
      .creational { fill: #5fd0a0; }
      .structural { fill: #6cbfee; }
      .behavioral { fill: #c4a0f0; }
      .link { stroke: #92918b; }
    }
  </style>
  <rect class="creational" x="2" y="2" width="12" height="12" rx="3" />
  <rect class="structural" x="18" y="2" width="12" height="12" rx="3" />
  <rect class="behavioral" x="10" y="18" width="12" height="12" rx="3" />
  <path class="link" d="M8 14v4h8M24 14v4h-8" stroke-width="1.5" fill="none" />
</svg>
